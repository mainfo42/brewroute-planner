[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Automated Every-2-Days (48-Hour) Beer News Database Refresh CRON Job
[functions."beer-news-cron"]
  schedule = "0 0 */2 * *"

# API Proxy to Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Dedicated HTML Pages for SEO & Google AdSense
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/news"
  to = "/news.html"
  status = 200

[[redirects]]
  from = "/beer-news"
  to = "/news.html"
  status = 200

# Client-side Single Page Application (SPA) routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
