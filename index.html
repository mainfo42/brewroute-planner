     crossorigin="anonymous"></script>

    <!-- Schema.org JSON-LD Structured Data: WebApplication, Organization, & Answer Engine (AGO/AEO) FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebApplication",
          "@id": "https://brewhop.app/#webapp",
          "name": "BrewHop",
          "alternateName": ["BeerHop", "BrewHop Trail Planner"],
          "url": "https://brewhop.app/",
          "description": "Mobile-optimized microbrewery travel route and Google Maps itinerary planner with craft beer style curation, top review ratings, and stay recommendations.",
          "applicationCategory": "TravelApplication",
          "operatingSystem": "All",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          },
          "featureList": [
            "Interactive microbrewery road trip itinerary builder",
            "Craft beer style curation (IPA, Hazy, Sour, Stout, Lager, Wild Ale)",
            "Turn-by-turn Google Maps & Apple Maps route export",
            "Certified brewery ratings, reviews, and taproom amenities",
            "Nearby stays, dog-friendly patios, and local food truck discovery"
          ],
          "screenshot": "https://brewhop.app/og-image.jpg"
        },
        {
          "@type": "Organization",
          "@id": "https://brewhop.app/#organization",
          "name": "BrewHop",
          "url": "https://brewhop.app/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://brewhop.app/favicon.svg"
          }
        },
        {
          "@type": "FAQPage",
          "@id": "https://brewhop.app/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How does BrewHop plan a microbrewery road trip?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "BrewHop allows travelers to search by city or destination, select their favorite craft beer styles (such as IPAs, Stouts, Sours, or Lagers), and automatically builds an optimized multi-stop brewery trail with distances, drive times, and direct Google Maps navigation."
              }
            },
            {
              "@type": "Question",
              "name": "Can I export brewery itineraries directly to Google Maps?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Every generated beer trail can be exported with a single tap to Google Maps or Apple Maps, preserving all waypoint stops in order for hands-free navigation."
              }
            },
            {
              "@type": "Question",
              "name": "What information is provided for each craft brewery?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Each brewery card provides community ratings, top poured beer styles, operating hours, outdoor and dog-friendly seating availability, food options, and direct links to directions."
              }
            },
            {
              "@type": "Question",
              "name": "Is BrewHop free to use?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes, BrewHop is completely free to use with no subscription required for planning brewery road trips and discovering independent taprooms."
              }
            }
          ]
        }
      ]
    }
    </script>

  <body class="bg-[#F2F8F0] text-[#122610] font-sans antialiased min-h-full selection:bg-[#D9EECF] selection:text-[#122610]">
    <!-- Netlify Forms detection form for React Single Page App (hidden mirror form per https://docs.netlify.com/manage/forms/setup/) -->
    <form name="contact" method="POST" action="/" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
